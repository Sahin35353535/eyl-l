<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Şey Söylemeliyim...</title>
    <!-- Google Fonts - Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.15);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        #evetBtn, #girisEvetBtn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            z-index: 2;
        }

        #evetBtn:hover, #girisEvetBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6);
        }

        #hayirBtn {
            background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            z-index: 10;
        }

        #mesaj {
            display: none;
            color: #d63384;
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
            line-height: 1.5;
            animation: fadeIn 0.5s ease-in-out;
        }

        #ikazContainer {
            display: none;
        }

        #ikazMesaji {
            color: #e63946;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Uçuşan Kalpler Efekti */
        .kalp {
            position: absolute;
            color: rgba(255, 107, 129, 0.6);
            font-size: 20px;
            animation: yukariUc 4s linear infinite;
            z-index: 1;
        }

        @keyframes yukariUc {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Arka Planda Uçuşan Kalpler -->
    <div class="kalp" style="left: 10%; animation-delay: 0s;">🥰</div>
    <div class="kalp" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="kalp" style="left: 70%; animation-delay: 1s;">🤍</div>
    <div class="kalp" style="left: 85%; animation-delay: 3s;">🫶🏻</div>
    <div class="kalp" style="left: 50%; animation-delay: 2.5s;">💕</div>

    <div class="container" id="card">
        <!-- Giriş Ekranı -->
        <div id="girisEkrani">
            <h1>Sana bir şey sormam gerekiyor... 🤍</h1>
            <button id="girisEvetBtn" onclick="ilkAdimiGec()">Evet 😊</button>
        </div>

        <!-- Ana Ekran (Barışma Sorusu) -->
        <div id="anaEkran" style="display: none;">
            <h1>Biliyorum Seni Belki Çok Üzdüm Ama Benimle Barışırmısın? 🥺🤍🫶🏻</h1>
            <div class="buttons" id="btnGroup">
                <button id="evetBtn" onclick="evetTiklandi()">Evet! 🥰</button>
                <button id="hayirBtn" onmouseover="kacir()" onclick="hayirTiklandiKontrol()">Hayır 😢</button>
            </div>
        </div>

        <!-- 2. Tıklamada Çıkacak Ekran -->
        <div id="ikazContainer">
            <div id="ikazMesaji">Hadi Amaaa Yapma İnatçı Kız Bu Benim Kodum Basamazsınnn 🤗</div>
            <button id="ikazHayirBtn" onclick="bastanBasla()" style="background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%); color: white; border-radius: 50px; padding: 12px 25px; border:none; cursor:pointer; font-family:'Quicksand', sans-serif; font-weight:bold;">Yine de Hayır 😢</button>
        </div>

        <!-- Son Ekran -->
        <div id="mesaj">
            Evettttt Beeee Öküzün Seni Çok Özledi Eylüşş 🤍🎉
        </div>
    </div>

    <script>
        let hayirTiklamaSayisi = 0;
        
        // "Hayır" butonuna basıldığında gösterilecek eğlenceli yazılar dizisi
        const hayirMetinleri = [
            "Emin misin? 🥺",
            "İnatçııı 😁",
            "Lütfennn 😢",
            "Basamazsın ki! 😜",
            "Hâlâ deniyorsun ha? 🤭",
            "İnatçı şey! 😤"
        ];

        function ilkAdimiGec() {
            document.getElementById('girisEkrani').style.display = 'none';
            document.getElementById('anaEkran').style.display = 'block';
        }

        function kacir() {
            const hayirBtn = document.getElementById('hayirBtn');
            const maxX = window.innerWidth - hayirBtn.offsetWidth - 50;
            const maxY = window.innerHeight - hayirBtn.offsetHeight - 50;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            hayirBtn.style.position = 'fixed';
            hayirBtn.style.left = randomX + 'px';
            hayirBtn.style.top = randomY + 'px';
        }

        function hayirTiklandiKontrol() {
            hayirTiklamaSayisi++;
            kacir();

            // Her tıklamada butonun üzerindeki yazıyı sıradaki eğlenceli sözle değiştir
            const rastgeleMetin = hayirMetinleri[Math.floor(Math.random() * hayirMetinleri.length)];
            document.getElementById('hayirBtn').innerText = rastgeleMetin;

            if (hayirTiklamaSayisi >= 3) {
                document.getElementById('anaEkran').style.display = 'none';
                document.getElementById('ikazContainer').style.display = 'block';
            }
        }

        function bastanBasla() {
            hayirTiklamaSayisi = 0;
            document.getElementById('ikazContainer').style.display = 'none';
            document.getElementById('anaEkran').style.display = 'block';
            
            const hayirBtn = document.getElementById('hayirBtn');
            hayirBtn.style.position = 'static';
            hayirBtn.innerText = "Hayır 😢";
        }

        function evetTiklandi() {
            document.getElementById('anaEkran').style.display = 'none';
            document.getElementById('ikazContainer').style.display = 'none';
            document.getElementById('mesaj').style.display = 'block';

            // "Evet" denildiğinde muhteşem bir konfeti ve kalp patlaması başlat
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff6b6b', '#ff9a9e', '#d63384', '#ffffff', '#20c997']
            });

            // Ekstra neşeli ikinci dalga konfeti
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
            }, 250);

            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 400);
        }
    </script>

</body>
</html>
